# Render Blueprint — Smart Asset Management
#
# Defines all three deployables in one place so the dashboard fields
# (root dir / build / publish) never have to be filled in by hand:
#
#   1. asset-service       -> Web Service  (backend/asset-service)
#   2. operations-service  -> Web Service  (backend/operations-service)
#   3. smart-asset-frontend-> Static Site  (frontend)
#
# Secrets are marked `sync: false`: Render prompts for them on first sync
# and stores them securely. They are NEVER committed to the repo.
#
# Deploy: Render Dashboard -> New + -> Blueprint -> pick this repo -> Apply.

services:
  # ---------------------------------------------------------------- #
  # Microservice 1 — asset-service (identity, assets, allocations)    #
  # ---------------------------------------------------------------- #
  - type: web
    name: asset-service
    runtime: node
    plan: free
    rootDir: backend/asset-service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_ISSUER
        value: asset-service
      - key: JWT_AUDIENCE
        value: asset-service,operations-service
      # secrets — entered in the Render dashboard, never stored in git
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SERVICE_TOKEN
        sync: false
      # allowed browser origin = the deployed frontend URL
      - key: CORS_ORIGINS
        fromService:
          name: smart-asset-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  # ---------------------------------------------------------------- #
  # Microservice 2 — operations-service (maintenance, technicians)    #
  # ---------------------------------------------------------------- #
  - type: web
    name: operations-service
    runtime: node
    plan: free
    rootDir: backend/operations-service
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health/ready
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_ISSUER
        value: asset-service
      - key: JWT_AUDIENCE
        value: asset-service,operations-service
      - key: ASSET_SERVICE_TIMEOUT_MS
        value: '5000'
      # cross-service call target = the public URL of asset-service
      - key: ASSET_SERVICE_URL
        fromService:
          name: asset-service
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # secrets — must match asset-service exactly
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SERVICE_TOKEN
        sync: false
      - key: CORS_ORIGINS
        fromService:
          name: smart-asset-frontend
          type: web
          envVarKey: RENDER_EXTERNAL_URL

  # ---------------------------------------------------------------- #
  # Frontend — React/Vite static site                                 #
  # ---------------------------------------------------------------- #
  - type: web
    name: smart-asset-frontend
    runtime: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      # SPA fallback so React Router deep links survive a refresh
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_ASSET_API_URL
        fromService:
          name: asset-service
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_OPS_API_URL
        fromService:
          name: operations-service
          type: web
          envVarKey: RENDER_EXTERNAL_URL
